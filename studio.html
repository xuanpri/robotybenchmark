<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena replay</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151b21;color:#e8eeee;font:15px system-ui}main{max-width:1500px;margin:auto;padding:16px}header,footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0 auto 0 0;font-size:24px}button,select,label{background:#29343b;color:inherit;border:1px solid #59646b;padding:7px;border-radius:4px;font:inherit}input[type=file]{max-width:240px}iframe{width:100%;aspect-ratio:16/9;border:none;background:#23242c;margin:12px 0}input[type=range]{flex:1;min-width:120px}output{color:#eda79e}
</style></head><body><main><header><h1>Arena replay</h1><button id="demo">Patrol demo</button><select id="survey" aria-label="Scene registry"><option value="">Scene registry</option></select><label>Open replay <input type="file" accept=".json" id="file"></label></header>
<iframe title="Replay views"></iframe><footer><button id="play">Play</button><select id="attempt" aria-label="Attempt"></select><select id="layout" aria-label="Observation"><option>split</option><option>omniscient</option><option>limited</option></select><select id="time" aria-label="Time mode"><option>simulation</option><option>wall-clock</option></select><input id="seek" type="range" min="0" value="0" aria-label="Seek"><output id="status"></output></footer></main><script type="module" src="/src/video/studio.ts"></script></body></html>
